name: Unlighthouse + SEO audit report
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'The website URL to analyze'
        required: true
        default: 'https://example.com'

permissions:
  contents: write

# Two runs at once would race on reports.json
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install -g @unlighthouse/cli@latest puppeteer @seomator/seo-audit@latest
          npx playwright install --with-deps chromium

      - name: Pick report id
        # https://www.Example.com:8080/path -> example.com-8080
        run: |
          echo "REPORT_ID=$(date -u +%Y-%m-%d_%H%M%S)" >> "$GITHUB_ENV"
          echo "SITE_SLUG=$(echo "$SITE_URL" | tr 'A-Z' 'a-z' | sed -E 's#^[a-z]+://##; s#[/?#].*##; s#^www\.##; s#[^a-z0-9.-]#-#g')" >> "$GITHUB_ENV"

      - name: Unlighthouse
        run: unlighthouse-ci --site "$SITE_URL" --build-static

      - name: SEO audit
        # exits 1 when score < 70; still publish the report
        run: |
          mkdir -p seo
          seomator audit "$SITE_URL" --format html -o seo/index.html || true
          seomator audit "$SITE_URL" --format json -o seo/results.json || true

      - name: Merge into existing gh-pages
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" site
            rm -rf site/.git
          else
            mkdir site
          fi
          dest="site/reports/$SITE_SLUG/$REPORT_ID"
          mkdir -p "$dest"
          cp -r .unlighthouse "$dest/unlighthouse"
          cp -r seo "$dest/seo"
          [ -f site/reports.json ] || echo '[]' > site/reports.json
          jq --arg id "$REPORT_ID" --arg site "$SITE_SLUG" --arg url "$SITE_URL" \
             --argjson seo "$( [ -f seo/index.html ] && echo true || echo false )" \
             '[{id: $id, site: $site, url: $url, seo: $seo}] + .' site/reports.json > tmp.json
          mv tmp.json site/reports.json
          cp dashboard/index.html site/index.html
          touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: false
          commit-message: "Report ${{ env.SITE_SLUG }}/${{ env.REPORT_ID }}"
