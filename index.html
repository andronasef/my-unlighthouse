<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Reports</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --line: #ddd; --link: #0b62d6; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #121212; --muted: #999; --line: #333; --link: #6ea8ff; } }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  a.btn { margin: 0; padding: 8px 14px; border-radius: 6px; background: var(--link); color: var(--bg); font-weight: 600; }
  a.btn:hover { text-decoration: none; opacity: .9; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.url { word-break: break-all; }
  a { color: var(--link); text-decoration: none; margin-right: 12px; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Audit Reports</h1>
  <a class="btn" href="https://github.com/andronasef/my-unlighthouse/actions/workflows/unlighthouse-report.yml" target="_blank" rel="noopener">+ Run new audit</a>
</header>
<input id="q" type="search" placeholder="Filter by site or date…" aria-label="Filter reports">
<table>
  <thead><tr><th>Date (UTC)</th><th>Site</th><th>Reports</th></tr></thead>
  <tbody id="rows"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
</table>
<script>
  const rows = document.getElementById('rows');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let reports = [];
  function render(q = '') {
    const list = reports.filter(r => (r.id + ' ' + r.url).toLowerCase().includes(q.toLowerCase()));
    rows.innerHTML = list.length ? list.map(r => {
      const base = `reports/${encodeURIComponent(r.site)}/${encodeURIComponent(r.id)}`;
      return `<tr>
      <td>${esc(r.id.replace('_', ' ').replace(/(\d\d)(\d\d)(\d\d)$/, '$1:$2:$3'))}</td>
      <td class="url">${esc(r.url)}</td>
      <td><a href="${base}/unlighthouse/">Unlighthouse</a>${r.seo ? `<a href="${base}/seo/">SEO audit</a><a href="${base}/seo/results.json">JSON</a>` : '<span class="muted">SEO failed</span>'}</td>
    </tr>`;
    }).join('') : '<tr><td colspan="3" class="muted">No reports yet.</td></tr>';
  }
  fetch('reports.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : [])
    .then(data => { reports = data; render(); })
    .catch(() => render());
  document.getElementById('q').addEventListener('input', e => render(e.target.value));
</script>
</body>
</html>
